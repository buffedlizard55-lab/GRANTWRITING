name: Refresh funding catalog

on:
  workflow_dispatch:
  schedule:
    # After the Grants.gov extract, which is published around 04:40 America/New_York.
    - cron: "20 11 * * *"
  push:
    branches:
      - "**"
    paths:
      - "pipeline/**"
      - "docs/js/**"
      - "docs/css/**"
      - "docs/index.html"
      - "docs/404.html"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-data.yml"
      - "pipeline.trigger"

permissions:
  contents: write

concurrency:
  group: refresh-funding-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Test the pipeline
        run: python -m unittest discover -s tests -v

      - name: Test browser logic and rendered views
        run: node --test tests/*.test.mjs

      - name: Refresh from official sources
        run: python -m pipeline.refresh

      - name: Validate published catalog
        run: python -m pipeline.validate_published

      - name: Commit catalog
        run: |
          git config user.name "grant-intel-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Refresh verified funding catalog"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
